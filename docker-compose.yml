      - /var/www/vhosts/puerto.to/private/.env
    volumes:
      - /var/www/vhosts/puerto.to/private/credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=1
      - WORKER_NAME=worker_3
    deploy:
      resources:
        limits:
          memory: 4g
    depends_on:
      - redis

  worker_4:
