services:
  redis:
    image: redis:7-alpine
    container_name: puerto_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512m

  puerto_studio:
    build: .
    container_name: puerto_studio
    restart: unless-stopped
    env_file:
      - /var/www/vhosts/puerto.to/private/.env
    volumes:
      - /var/www/vhosts/puerto.to/private/credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - PORT=3000
      - APP_MODE=web
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 4g
    ports:
      - "127.0.0.1:3005:3000"
    depends_on:
      - redis

  worker_1:
    build: .
    container_name: puerto_worker_1
    restart: unless-stopped
    env_file:
      - /var/www/vhosts/puerto.to/private/.env
    volumes:
      - /var/www/vhosts/puerto.to/private/credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=1
      - WORKER_NAME=worker_1
    deploy:
      resources:
        limits:
          memory: 4g
    depends_on:
      - redis

  worker_2:
    build: .
    container_name: puerto_worker_2
    restart: unless-stopped
    env_file:
      - /var/www/vhosts/puerto.to/private/.env
