services:
  nginx:
    image: nginx:alpine
    container_name: puerto_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - puerto_studio

  certbot:
    image: certbot/certbot
    container_name: puerto_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done'"

  redis:
    image: redis:7-alpine
    container_name: puerto_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 512m

  puerto_studio:
    build: .
    container_name: puerto_studio
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - PORT=3000
      - APP_MODE=web
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 2g
    depends_on:
      - redis

  worker_1:
    build: .
    container_name: puerto_worker_1
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=1
      - WORKER_NAME=worker_1
    deploy:
      resources:
        limits:
          memory: 1536m
    depends_on:
      - redis

  worker_2:
    build: .
    container_name: puerto_worker_2
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=1
      - WORKER_NAME=worker_2
    deploy:
      resources:
        limits:
          memory: 1536m
    depends_on:
      - redis

  worker_3:
    build: .
    container_name: puerto_worker_3
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=1
      - WORKER_NAME=worker_3
    deploy:
      resources:
        limits:
          memory: 1536m
    depends_on:
      - redis

  worker_4:
    build: .
    container_name: puerto_worker_4
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=1
      - WORKER_NAME=worker_4
    deploy:
      resources:
        limits:
          memory: 1536m
    depends_on:
      - redis

volumes:
  redis_data:
  certbot_webroot:
  certbot_certs:
