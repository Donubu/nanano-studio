services:
  nginx:
    image: nginx:alpine
    container_name: puerto_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - certbot_webroot:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - redis

  certbot:
    image: certbot/certbot
    container_name: puerto_certbot
    volumes:
      - certbot_webroot:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do sleep 12h & wait $${!}; certbot renew --webroot -w /var/www/certbot --quiet; done'"

  redis:
    image: redis:7-alpine
    container_name: puerto_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 3072mb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --hz 10 --auto-aof-rewrite-percentage 100 --auto-aof-rewrite-min-size 64mb --client-output-buffer-limit "pubsub 32mb 8mb 60"
    deploy:
      resources:
        limits:
          memory: 4096m

  puerto_studio_blue:
    build: .
    container_name: puerto_studio_blue
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048
      - PORT=3000
      - APP_MODE=web
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 4096m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - redis

  puerto_studio_green:
    build: .
    container_name: puerto_studio_green
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=2048
      - PORT=3000
      - APP_MODE=web
      - REDIS_URL=redis://redis:6379
    deploy:
      resources:
        limits:
          memory: 4096m
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      - redis
    profiles:
      - donotstart

  worker_1:
    build: .
    container_name: puerto_worker_1
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=3072
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=3
      - WORKER_NAME=worker_1
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 4096m
    depends_on:
      - redis

  worker_2:
    build: .
    container_name: puerto_worker_2
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=3072
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=3
      - WORKER_NAME=worker_2
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 4096m
    depends_on:
      - redis

  worker_3:
    build: .
    container_name: puerto_worker_3
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - ./credentials.json:/run/secrets/credentials.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/run/secrets/credentials.json
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=3072
      - APP_MODE=worker
      - REDIS_URL=redis://redis:6379
      - WORKER_CONCURRENCY=3
      - WORKER_NAME=worker_3
    stop_grace_period: 120s
    deploy:
      resources:
        limits:
          memory: 4096m
    depends_on:
      - redis

volumes:
  redis_data:
  certbot_webroot:
  certbot_certs:
